services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: firmplant
      POSTGRES_PASSWORD: firmplant
      POSTGRES_DB: firmplant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firmplant"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: firmplant
      MINIO_ROOT_PASSWORD: firmplant-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://firmplant:firmplant@postgres:5432/firmplant?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
volumes:
  pgdata:
  miniodata:
