<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invest · Firmcop Modular</title>
<meta name="description" content="Buy into Firmcop modular buildings that earn: off-plan, building now, ready, or completed and already let. Photos, video, units and payment plans for each model.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="fc-pages.css">
<meta name="fc-footer" content="auto">
<style>
.ihero{padding:44px 0 10px}
.ihero h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(40px,5vw,66px);line-height:1;margin:6px 0 12px;max-width:900px}
.ihero p{max-width:66ch;color:var(--muted);margin:0;font-size:17px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:26px 0 8px;padding:0;list-style:none}
@media(max-width:820px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps li{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}
.steps b{display:block;margin:2px 0}.steps span{font-size:14px;color:var(--muted)}
.steps i{font:500 12px 'IBM Plex Mono',monospace;color:var(--brass);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 4px}
.chips button{min-height:40px;padding:0 16px;border:1.5px solid #CFC6B5;border-radius:999px;background:#fff;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:18px 0 40px}
@media(max-width:1000px){.models{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.models{grid-template-columns:1fr}}
.model{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;color:inherit}
.model:hover{border-color:#BDB29C}
.model .ph{aspect-ratio:16/11;background:#E7E1D6 center/cover no-repeat;position:relative}
.badge-st{position:absolute;left:12px;top:12px;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:#fff;color:var(--ink)}
.st-offplan{background:#E7F1FB!important;color:#1D4E7A!important}.st-building{background:#FFF1D6!important;color:#6B4A00!important}.st-ready,.st-completed{background:#E3F1E6!important;color:#1F5A2E!important}
.badge-v{position:absolute;right:12px;top:12px;font:600 11px/1 'IBM Plex Mono',monospace;padding:7px 10px;border-radius:999px;background:rgba(13,12,10,.75);color:#fff}
.model .bd{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.model h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:28px;line-height:1.05;margin:0}
.model .meta{font:500 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.model p{margin:0;color:var(--muted);font-size:15px}
.model .nums{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.model .nums b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:500}
.bar{height:6px;background:#ECE8E0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass)}
.mhero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:36px;padding:26px 0 10px}
@media(max-width:940px){.mhero{grid-template-columns:minmax(0,1fr);gap:22px}}
.mhero>*,.icols>*{min-width:0}
.stage-main{aspect-ratio:16/10;background:#0D0C0A center/cover no-repeat;border-radius:6px;overflow:hidden;position:relative}
.stage-main iframe,.stage-main video{width:100%;height:100%;border:0;display:block;background:#000}
.stage-main button.zoom{position:absolute;inset:0;border:0;background:transparent;cursor:zoom-in}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 96px;height:68px;border:2px solid transparent;border-radius:4px;background:#E7E1D6 center/cover no-repeat;cursor:pointer;padding:0;position:relative}
.thumbs button[aria-pressed=true]{border-color:var(--brass)}
.thumbs button.v::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.facts{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;align-self:start;position:sticky;top:16px}
.facts h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,4vw,50px);line-height:1;margin:10px 0 8px}
.facts .price{font-family:'Cormorant Garamond',Georgia,serif;font-size:36px;margin:14px 0 0}
.facts .price small{font-family:'Manrope',sans-serif;font-size:14px;color:var(--muted)}
.facts .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.icols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:36px;padding:20px 0 30px}
@media(max-width:940px){.icols{grid-template-columns:minmax(0,1fr)}}
.icols section{margin-bottom:30px}.icols h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:32px;margin:0 0 10px}
.icols p{margin:0 0 12px;font-size:17px;color:#2E2B26}
ul.hl{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(max-width:640px){ul.hl{grid-template-columns:1fr}}
ul.hl li{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px 10px 34px;position:relative;font-size:15px}
ul.hl li::before{content:'✓';position:absolute;left:12px;top:10px;color:var(--brass);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
table.t th,table.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}table.t th{background:#F0EBE2;font-weight:600}table.t td.n,table.t th.n{text-align:right}
.ust{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.ust.available{color:#1F5A2E}.ust.reserved,.ust.held{color:#6B4A00}.ust.sold{color:#9B2C1F}
.tw{overflow-x:auto}
.note{font-size:13px;color:var(--muted);line-height:1.55}
dialog.lb{border:0;padding:0;background:transparent;max-width:min(1200px,96vw)}dialog.lb::backdrop{background:rgba(13,12,10,.9)}
dialog.lb img{max-height:86vh;width:auto;margin:0 auto;border-radius:4px;display:block}
dialog.lb .row{display:flex;justify-content:space-between;align-items:center;color:#F2EBDF;gap:12px;margin-top:8px}
dialog.lb button{min-height:44px;min-width:44px;background:transparent;color:#F2EBDF;border:1px solid #5C5850;border-radius:4px;font:inherit;cursor:pointer}
.empty{padding:40px 0;color:var(--muted)}
</style>
</head>
<body>
<header id="fc-head" class="fc-head"></header>
<main class="wrap" id="main" tabindex="-1"><!--SSR--></main>
<dialog class="lb" id="lb" aria-label="Photo"><img id="lbimg" alt=""><div class="row"><button type="button" id="lbprev" aria-label="Previous photo">‹</button><span id="lbcap"></span><span><button type="button" id="lbnext" aria-label="Next photo">›</button> <button type="button" id="lbx" aria-label="Close">×</button></span></div></dialog>
<script src="ds-config.js"></script>
<script src="fc-site.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s), esc = FC.esc, fmt = FC.fmt;
  const R = window.FC_ROUTE || {}, qp = new URLSearchParams(location.search);
  const slug = R.slug || qp.get('m') || '', kind = R.kind || (slug ? 'model' : 'invest');
  FC.header($('#fc-head'), '/invest');
  const STAGE = { offplan: 'Off-plan', building: 'Building now', ready: 'Ready to buy', completed: 'Completed and earning' };
  const paras = (t) => (t || '').split(/\n{2,}/).map((x) => x.trim()).filter(Boolean).map((x) => `<p>${esc(x)}</p>`).join('');
  const ytId = (u) => { const m = String(u || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/); return m ? m[1] : ''; };
  const vimeoId = (u) => { const m = String(u || '').match(/vimeo\.com\/(?:video\/)?(\d+)/); return m ? m[1] : ''; };
  const month = (d) => d ? new Date(d).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : '';
  const photos = (o) => (o.media || []).filter((x) => x && x.type !== 'video' && x.url);
  const cover = (o) => (photos(o)[0] || {}).url || o.image_url || '';
  const avail = (o, units) => units && units.length ? units.filter((u) => u.status === 'available').length : Math.max(0, (o.units || 0) - (o.taken || 0));
  const total = (o, units) => units && units.length ? units.length : (o.units || 0);
  const yieldTxt = (o) => o.yield_lo ? (o.yield_hi && o.yield_hi !== o.yield_lo ? o.yield_lo + '–' + o.yield_hi : o.yield_lo) + '%' : '';
  const COLS = 'id,slug,name,stage,sector,place,county,unit_type,size_m2,bedrooms,summary,price,yield_lo,yield_hi,units,taken,media,image_url,completion_date,status_label,is_sample,sort';

  function card(o) {
    const a = avail(o), t = total(o), vids = (o.media || []).filter((x) => x.type === 'video').length;
    return `<a class="model" href="/invest/${encodeURIComponent(o.slug)}"><div class="ph" data-bg="${esc(FC.img(cover(o), 900))}"><span class="badge-st st-${esc(o.stage)}">${esc(STAGE[o.stage] || '')}</span>${vids ? '<span class="badge-v">▶ video</span>' : ''}</div>
      <div class="bd"><span class="meta">${esc([o.sector, o.place].filter(Boolean).join(' · '))}${o.is_sample ? ' · sample' : ''}</span><h2>${esc(o.name)}</h2>${o.summary ? `<p>${esc(o.summary)}</p>` : ''}
      <p style="font-size:14px">${esc([o.unit_type, o.size_m2 ? fmt(o.size_m2) + ' m²' : '', o.stage === 'offplan' || o.stage === 'building' ? (o.completion_date ? 'Ready ' + month(o.completion_date) : o.status_label || '') : o.status_label || ''].filter(Boolean).join(' · '))}</p>
      <div class="bar" aria-label="${t - a} of ${t} units taken"><i style="width:${t ? Math.round(100 * (t - a) / t) : 0}%"></i></div>
      <div class="nums"><span>Per unit<b>KES ${fmt(o.price || 0)}</b></span>${yieldTxt(o) ? `<span>Projected yield<b>${esc(yieldTxt(o))}</b></span>` : ''}<span style="text-align:right">Available<b>${a ? a + ' of ' + t : 'Sold out'}</b></span></div></div></a>`;
  }
  function index() {
    FC.rest('investment_opportunities?select=' + COLS + '&published=eq.true&order=sort.asc,name.asc').then((rows) => {
      const st = { s: qp.get('stage') || '' };
      const stages = Object.keys(STAGE).filter((k) => rows.some((r) => r.stage === k));
      const draw = () => { const list = st.s ? rows.filter((r) => r.stage === st.s) : rows; $('#models').innerHTML = list.map(card).join('') || '<p class="empty">Nothing at this stage right now.</p>'; };
      $('#main').innerHTML = `<section class="ihero"><p class="eyebrow">Invest with Firmcop</p><h1>Own units in modular buildings that earn</h1>
        <p>Holiday chalets, rental blocks, shops and offices we design, build and can run for you. Buy off-plan for the best price, while building, or ready and already let. Every model shows its photos, video, units and payment plan.</p>
        <ol class="steps"><li><i>01</i><b>Choose a model</b><span>Photos, video and the numbers</span></li><li><i>02</i><b>Reserve units</b><span>An advisor calls you first</span></li><li><i>03</i><b>Pay in stages</b><span>Deposit, then milestones</span></li><li><i>04</i><b>Earn</b><span>Let it yourself or through an operator</span></li></ol>
        ${stages.length > 1 ? `<div class="chips" role="group" aria-label="Stage"><button type="button" data-s="" aria-pressed="${!st.s}">All</button>${stages.map((k) => `<button type="button" data-s="${k}" aria-pressed="${st.s === k}">${esc(STAGE[k])}</button>`).join('')}</div>` : ''}</section>
        <section class="models" id="models"></section>
        <p class="note" style="max-width:900px;margin:0 0 40px">Projected yields are estimates based on the rates, occupancy and costs stated for each model. Income is not guaranteed and can fall. Read each model's documents and take independent legal and financial advice before you invest.</p>`;
      $('#main').querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { st.s = b.dataset.s; $('#main').querySelectorAll('[data-s]').forEach((x) => x.setAttribute('aria-pressed', x === b)); history.replaceState(null, '', st.s ? '?stage=' + st.s : location.pathname); draw(); });
      draw();
    }).catch(() => { $('#main').innerHTML = '<p class="empty">The investment models could not load just now. Please refresh.</p>'; });
  }

  function model() {
    const got = window.FC_MODEL ? Promise.resolve([window.FC_MODEL]) : FC.rest('investment_opportunities?select=*&published=eq.true&slug=eq.' + encodeURIComponent(slug));
    got.then((rows) => {
      const o = rows[0]; if (!o) { $('#main').innerHTML = '<p class="empty">That investment model is not available. <a href="/invest">See all models</a>.</p>'; return; }
      return Promise.all([FC.rest('investment_units?select=id,code,floor,size_m2,price,status,note,sort&opportunity_id=eq.' + o.id + '&order=sort.asc,code.asc').catch(() => []),
        FC.rest('investment_opportunities?select=' + COLS + '&published=eq.true&id=neq.' + o.id + '&order=sort.asc&limit=3').catch(() => []),
        o.work_slug ? FC.rest('works?select=slug,title,location&published=eq.true&slug=eq.' + encodeURIComponent(o.work_slug)).catch(() => []) : [],
        o.product_slug ? FC.rest('catalog_products?select=slug,name,kind&published=eq.true&slug=eq.' + encodeURIComponent(o.product_slug)).catch(() => []) : []])
        .then(([units, more, work, prod]) => render(o, units, more, work[0], prod[0]));
    }).catch(() => { $('#main').innerHTML = '<p class="empty">This page could not load just now. Please refresh.</p>'; });
  }
  function render(o, units, more, work, prod) {
    document.title = (o.seo_title || o.name) + ' · Invest · Firmcop';
    const media = (o.media || []).filter((x) => x && x.url), ph = media.filter((x) => x.type !== 'video');
    if (!media.length && o.image_url) media.push({ type: 'photo', url: o.image_url });
    const a = avail(o, units), t = total(o, units), plan = (o.payment_plan || []).filter((x) => x.label || x.pct), docs = (o.documents || []).filter((x) => x.url);
    const studio = o.design_slug ? '/3d-studio?design=' + encodeURIComponent(o.design_slug) : '';
    const facts = [['Stage', STAGE[o.stage]], ['Status', o.status_label], ['Unit', o.unit_type], ['Size', o.size_m2 ? fmt(o.size_m2) + ' m² per unit' : ''], ['Bedrooms', o.bedrooms], ['Bathrooms', o.bathrooms],
      ['Place', [o.place, o.county].filter(Boolean).join(', ')], [o.stage === 'completed' || o.stage === 'ready' ? 'Completed' : 'Expected completion', month(o.completion_date)], ['Handover', o.handover], ['Units', a ? a + ' of ' + t + ' available' : 'All ' + t + ' taken']].filter((x) => x[1] != null && x[1] !== '');
    const income = [['Projected yield', yieldTxt(o) ? yieldTxt(o) + ' a year' : ''], ['Nightly rate', o.rent_night ? 'KES ' + fmt(o.rent_night) : ''], ['Monthly rent', o.rent_month ? 'KES ' + fmt(o.rent_month) : ''], ['Occupancy assumed', o.occupancy_pct ? o.occupancy_pct + '%' : ''],
      ['Management fee', o.mgmt_fee_pct ? o.mgmt_fee_pct + '%' : ''], ['Operator', o.operator], ['Income split', o.split], ['What you own', o.own_terms]].filter((x) => x[1]);
    $('#main').innerHTML = `<nav class="crumbs" aria-label="Breadcrumb" style="padding-top:20px"><a href="/invest">Invest</a><span aria-hidden="true">›</span><span>${esc(o.name)}</span></nav>
      <div class="mhero"><div><div class="stage-main" id="sm"></div>${media.length > 1 ? `<div class="thumbs" role="group" aria-label="Photos and video">${media.map((x, k) => { const y = ytId(x.url); const bg = x.type === 'video' ? (x.poster ? FC.img(x.poster, 200) : y ? 'https://img.youtube.com/vi/' + y + '/mqdefault.jpg' : FC.img(cover(o), 200)) : FC.img(x.url, 200);
          return `<button type="button" class="${x.type === 'video' ? 'v' : ''}" data-k="${k}" aria-pressed="${k === 0}" aria-label="${x.type === 'video' ? 'Video' : 'Photo'} ${k + 1}${x.caption ? ': ' + esc(x.caption) : ''}" data-bg="${esc(bg)}"></button>`; }).join('')}</div>` : ''}
        <p class="note" id="smcap" style="margin:6px 0 0"></p></div>
        <aside class="facts" aria-label="Key facts"><span class="badge-st st-${esc(o.stage)}" style="position:static;display:inline-block">${esc(STAGE[o.stage] || '')}</span>${o.is_sample ? ' <span class="note">Sample listing</span>' : ''}
          <h1>${esc(o.name)}</h1>${o.summary ? `<p style="margin:0;font-size:16px;color:#3D3A34">${esc(o.summary)}</p>` : ''}
          <p class="price">KES ${fmt(o.price || 0)} <small>per unit</small></p>${o.deposit_pct ? `<p class="note" style="margin:2px 0 0">Deposit ${o.deposit_pct}%: KES ${fmt(Math.round((o.price || 0) * o.deposit_pct / 100))}</p>` : ''}
          <div class="bar" style="margin-top:14px"><i style="width:${t ? Math.round(100 * (t - a) / t) : 0}%"></i></div><p class="note" style="margin:6px 0 0">${a ? a + ' of ' + t + ' units available' : 'Fully reserved'}${yieldTxt(o) ? ' · projected yield ' + esc(yieldTxt(o)) : ''}</p>
          <div class="btns"><button class="btn" type="button" id="res">${a ? 'Reserve a unit' : 'Join the waitlist'}</button>${docs.length ? `<a class="btn line" href="${esc(docs[0].url)}" target="_blank" rel="noopener">${esc(docs[0].label || 'Information pack')}</a>` : '<button class="btn line" type="button" id="pack">Ask for the information pack</button>'}<button class="btn line" type="button" id="vis">Book a site visit</button></div>
          <p style="margin:12px 0 0"><a href="#" data-fc-wa>WhatsApp us about this</a></p></aside></div>
      <div class="icols"><div>
        ${o.story ? `<section><h2>About this model</h2>${paras(o.story)}</section>` : ''}
        ${(o.highlights || []).length ? `<section><h2>Highlights</h2><ul class="hl">${o.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></section>` : ''}
        ${units.length ? `<section><h2>Units</h2><div class="tw"><table class="t"><thead><tr><th>Unit</th><th>Floor</th><th class="n">Size</th><th class="n">Price</th><th>Status</th><th></th></tr></thead><tbody>${units.map((u) => `<tr><td><b>${esc(u.code)}</b>${u.note ? `<br><span class="note">${esc(u.note)}</span>` : ''}</td><td>${esc(u.floor || '')}</td><td class="n">${u.size_m2 || o.size_m2 ? fmt(u.size_m2 || o.size_m2) + ' m²' : ''}</td><td class="n">KES ${fmt(u.price || o.price || 0)}</td><td><span class="ust ${esc(u.status)}">${esc(u.status)}</span></td><td>${u.status === 'available' ? `<button class="btn sm line" type="button" data-u="${esc(u.code)}">Reserve</button>` : ''}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
        ${plan.length ? `<section><h2>Payment plan</h2><div class="tw"><table class="t"><thead><tr><th>Stage</th><th>When</th><th class="n">Share</th><th class="n">Per unit</th></tr></thead><tbody>${plan.map((x) => `<tr><td>${esc(x.label || '')}</td><td>${esc(x.when || '')}</td><td class="n">${x.pct ? x.pct + '%' : ''}</td><td class="n">${x.pct ? 'KES ' + fmt(Math.round((o.price || 0) * x.pct / 100)) : ''}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
        ${income.length ? `<section><h2>Projected income</h2><dl class="specs">${income.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p class="note" style="margin-top:10px">These are projections from the stated rates, occupancy and costs, not promises. Income can fall. Take independent legal and financial advice before investing.</p></section>` : ''}
      </div><aside>
        <section><h2>Key facts</h2><dl class="specs">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${o.map_url ? `<p style="margin-top:10px"><a href="${esc(o.map_url)}" target="_blank" rel="noopener">See it on the map</a></p>` : ''}</section>
        ${work || prod || studio ? `<section><h2>Based on</h2>${work ? `<p>A real Firmcop build: <a href="/works/${esc(work.slug)}">${esc(work.title)}</a>${work.location ? ', ' + esc(work.location) : ''}.</p>` : ''}${prod ? `<p>The <a href="${FC.link.product(prod)}">${esc(prod.name)}</a> from our Collection.</p>` : ''}${studio ? `<p><a class="btn line" href="${studio}">Open the plan in 3D</a></p>` : ''}</section>` : ''}
        ${docs.length ? `<section><h2>Documents</h2><ul style="padding-left:18px;margin:0">${docs.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label || 'Document')}</a></li>`).join('')}</ul></section>` : ''}
      </aside></div>
      ${more.length ? `<section style="padding-bottom:40px"><h2 class="serif" style="font-size:34px;margin:0 0 14px">More to invest in</h2><div class="models" style="padding:0">${more.map(card).join('')}</div></section>` : ''}`;
    // media stage: photos open the lightbox, videos play in place
    const sm = $('#sm'), photosOnly = media.filter((x) => x.type !== 'video');
    const show = (k) => { const x = media[k]; if (!x) { sm.style.backgroundImage = `url('${FC.img(cover(o), 1600)}')`; return; }
      $('#main').querySelectorAll('.thumbs button').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.k === k)); $('#smcap').textContent = x.caption || '';
      if (x.type === 'video') { sm.style.backgroundImage = 'none'; const y = ytId(x.url), v = vimeoId(x.url);
        sm.innerHTML = y ? `<iframe src="https://www.youtube-nocookie.com/embed/${y}?rel=0" title="${esc(x.caption || o.name + ' video')}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" loading="lazy"></iframe>`
          : v ? `<iframe src="https://player.vimeo.com/video/${v}" title="${esc(x.caption || o.name + ' video')}" allow="fullscreen; picture-in-picture" loading="lazy"></iframe>`
          : `<video src="${esc(x.url)}" controls playsinline preload="metadata" ${x.poster ? `poster="${esc(FC.img(x.poster, 1600))}"` : ''}></video>`; return; }
      sm.innerHTML = '<button type="button" class="zoom" aria-label="Open the photo larger"></button>'; sm.style.backgroundImage = `url('${FC.img(x.url, 1600)}')`;
      sm.querySelector('.zoom').onclick = () => openLb(photosOnly.indexOf(x)); };
    $('#main').querySelectorAll('.thumbs button').forEach((b) => b.onclick = () => show(+b.dataset.k));
    show(0);
    const lb = $('#lb'); let at = 0;
    const lbShow = (k) => { at = (k + photosOnly.length) % photosOnly.length; const x = photosOnly[at]; $('#lbimg').src = FC.img(x.url, 1800); $('#lbimg').alt = x.caption || o.name; $('#lbcap').textContent = (x.caption || '') + '  ' + (at + 1) + ' / ' + photosOnly.length; };
    function openLb(k) { if (k < 0 || !photosOnly.length) return; lbShow(k); if (lb.showModal) lb.showModal(); }
    $('#lbprev').onclick = () => lbShow(at - 1); $('#lbnext').onclick = () => lbShow(at + 1); $('#lbx').onclick = () => lb.close();
    lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') lbShow(at - 1); if (e.key === 'ArrowRight') lbShow(at + 1); });
    lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
    const reserve = (code) => FC.lead(a ? 'reservation' : 'waitlist', { eyebrow: o.name, title: a ? 'Reserve a unit' : 'Join the waitlist',
      intro: a ? 'Tell us how to reach you. An investment advisor calls to walk you through the documents before any payment.' : 'This model is fully reserved. We will tell you if a unit is released or a similar model opens.',
      summary: a ? (code ? 'Unit ' + esc(code) + ' · ' : '') + 'KES ' + fmt(o.price || 0) + (o.deposit_pct ? ' · deposit ' + o.deposit_pct + '%' : '') : '', context: { opportunity: o.name, slug: o.slug, unit: code || null, stage: o.stage, amount: o.price } });
    $('#res').onclick = () => reserve(null);
    $('#main').querySelectorAll('[data-u]').forEach((b) => b.onclick = () => reserve(b.dataset.u));
    const pk = $('#pack'); if (pk) pk.onclick = () => FC.lead('info_pack', { eyebrow: o.name, context: { opportunity: o.name, slug: o.slug } });
    $('#vis').onclick = () => FC.lead('visit', { eyebrow: o.name, intro: 'See the site or a finished unit. Tell us when suits you.', context: { opportunity: o.name, slug: o.slug } });
  }
  kind === 'model' ? model() : index();
})();
</script>
