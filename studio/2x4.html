<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1c1b19;--muted:#6b6862;--line:#dedad2;--accent:oklch(0.62 0.16 45)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#e9e6df;color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--ink)} a:hover{color:var(--accent)}
  button,select,input{font:inherit;color:inherit}
  three-d-stage:not(:defined){visibility:hidden}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh}
  three-d-stage{display:block;width:100%;height:100%}
  .vp{position:relative;min-width:0}
  .hint{position:absolute;left:16px;top:16px;background:rgba(251,250,247,.94);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;max-width:320px}
  .hint b{font-weight:600}
  aside{background:#fbfaf7;border-left:1px solid var(--line);overflow-y:auto;min-height:0}
  .hd{padding:18px 20px;border-bottom:1px solid var(--line)}
  .eyebrow{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
  h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .sub{font:400 11px/1.5 "IBM Plex Mono",monospace;color:var(--muted);margin-top:5px}
  .sec{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  h2{margin:0;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  .seg button{flex:1;appearance:none;border:0;background:none;height:34px;font-size:12px;cursor:pointer;padding:0 6px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--ink);color:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
  .row small{display:block;color:var(--muted);font-size:11px}
  .sw{display:flex;gap:7px}
  .sw button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;outline-offset:3px}
  .sw button.on{outline:2px solid var(--ink)}
  select{border:1px solid var(--line);border-radius:5px;background:#fff;height:32px;padding:0 6px;font-size:12px;max-width:150px}
  input[type=checkbox]{width:18px;height:18px;accent-color:#1c1b19}
  input[type=range]{width:140px;accent-color:#1c1b19}
  .op{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:7px 8px;border-radius:6px;font-size:12.5px}
  .op.on{background:#efe9dd;box-shadow:inset 0 0 0 1px var(--ink)}
  .op .cd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted)}
  .grp{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .lines{display:flex;flex-direction:column;font-size:12px}
  .lines div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #ece9e2}
  .lines span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tot{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-top:4px}
  .tot b{font-size:20px}
  .note{font-size:11.5px;line-height:1.45;color:var(--muted);margin:0}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .g3 label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .g3 input{height:30px;border:1px solid var(--line);border-radius:5px;padding:0 6px;width:100%;background:#fff;font-size:12px}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btns button{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;font-size:12px}
  .btns button:hover{border-color:var(--ink)}
  .insp{background:#f4efe6}
  .insp .nm{font-weight:600;font-size:14px}
  details.sec summary{cursor:pointer;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .cl{cursor:pointer}.cl:hover{background:#f1ede5}.cl.off span{color:var(--muted);text-decoration:line-through}
  .warn{font-size:12px;line-height:1.4;padding:8px 10px;border-radius:6px;background:#fff4e0;border:1px solid #efd7a8}
  @media (max-width:860px){html,body{height:auto}.app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>

  <aside id="panel"></aside>
</div>

<script type="module">

const W = 2.438, L = 6.058, H = 2.896, FP = 0.15, RAIL = 0.14, FLR = 0.15, U2 = H + FLR;

  { g: 'Ground floor', id: 'E3a', label: 'Kitchen · east side (sink)', c: 'c3', f: 'E', u: 5.3, types: WINS, def: 'window' },
  { g: 'Ground floor', id: 'E3b', label: 'Kitchen · east side (south)', c: 'c3', f: 'E', u: 7.6, types: WINS, def: 'none' },
  { g: 'Ground floor', id: 'N3', label: 'Laundry / mudroom · north end', c: 'c3', f: 'N', u: 10.327, types: ['door', 'window', 'tall', 'none'], def: 'door' },
  { g: 'Ground floor', id: 'W4', label: 'Foyer · entry (west end of #4)', c: 'c4', f: 'W', u: 1.219, types: ['door', 'french', 'slider', 'none'], def: 'door', cd: 'open' },
  { g: 'Ground floor', id: 'N4', label: 'Foyer · north side', c: 'c4', f: 'N', u: 3.6, types: WINS, def: 'window' },
  { g: 'Ground floor', id: 'E4', label: 'Foyer · east end', c: 'c4', f: 'E', u: 1.219, types: ['door', 'window', 'tall', 'none'], def: 'none' },
  { g: 'Upper floor', id: 'S5', label: 'Bedroom 2 · balcony door', c: 'c5', f: 'S', u: 1.219, types: DOORS, def: 'slider' },
  { g: 'Upper floor', id: 'W5', label: 'Bedroom 2 · west side', c: 'c5', f: 'W', u: 5.8, types: WINS, def: 'window' },

  { g: 'Upper floor', id: 'S7', label: 'Master · balcony door (#7)', c: 'c7', f: 'S', u: 10.327, types: DOORS, def: 'slider' },
  { g: 'Upper floor', id: 'N7', label: 'Master closet · north end', c: 'c7', f: 'N', u: 10.327, types: ['door', ...WINS], def: 'window' },
  { g: 'Upper floor', id: 'E7a', label: 'Master · east side', c: 'c7', f: 'E', u: 5.4, types: WINS, def: 'window' },
  { g: 'Upper floor', id: 'E7b', label: 'Master · east side (south)', c: 'c7', f: 'E', u: 7.6, types: WINS, def: 'tall' },
  { g: 'Sitting area (above foyer)', id: 'SW', label: 'Door to north balcony', c: 'sit', f: 'W', u: 1.219, types: ['french', 'door', 'window', 'none'], def: 'french' },
  { g: 'Sitting area (above foyer)', id: 'SE', label: 'Door to rear landing', c: 'sit', f: 'E', u: 1.219, types: ['french', 'door', 'window', 'none'], def: 'french' },
  { g: 'Sitting area (above foyer)', id: 'SN', label: 'North window', c: 'sit', f: 'N', u: 5.5, types: WINS, def: 'picture' },

const CCOL = [['#b7c7d3', 'Pale blue'], ['#e4e5e2', 'White'], ['#4b4f53', 'Graphite'], ['#8a3b2c', 'Oxide red']];
const ICOL = [['#7d8559', 'Olive'], ['#5c5e60', 'Charcoal'], ['#8a6a4a', 'Timber'], ['#d9d6cf', 'Light grey']];
const DEF = { view: 'full', ccol: CCOL[0][0], icol: ICOL[0][0], glass: 'full', cx: {}, dups: [], midW: 4.232, eng: { roofQ: 0.75, floorQ: 1.5, wind: 1.0, maxCut: 1.2, defl: 360, balQ: 2.5, pad: 0.6, bearing: 100 }, opw: {}, guards: {}, guardAll: {}, rnd: { env: 'studio', sun: 150, exp: 1, lawn: true, terrace: true, path: true, shrubs: true, hedge: false, fence: false, trees: 12, seed: 7, hq: true }, clere: true, mezz: 'part', slide: 0.35, deck: true, balS: true, balN: true, landing: true, furn: true, ops: {}, cds: {} };
let S = JSON.parse(JSON.stringify(DEF)), SEL = null;
try { S = { ...S, ...JSON.parse(localStorage.getItem('c2x4-cfg') || '{}') }; } catch (e) {}
S.cx = S.cx || {}; S.dups = S.dups || []; S.midW = S.midW || 4.232; S.eng = { ...DEF.eng, ...(S.eng || {}) }; S.opw = S.opw || {}; S.guards = S.guards || {}; S.guardAll = S.guardAll || {}; S.rnd = { ...DEF.rnd, ...(S.rnd || {}) };
SLOTS.forEach(s => { if (!S.ops[s.id]) S.ops[s.id] = s.def; if (s.cd && !S.cds[s.id]) S.cds[s.id] = s.cd; });
const save = () => { try { localStorage.setItem('c2x4-cfg', JSON.stringify(S)); } catch (e) {} };

function mats() {
  const m = (name, color, r = 0.6, mt = 0, x = {}) => Object.assign(new THREE.MeshStandardMaterial({ color, roughness: r, metalness: mt, ...x }), { name });
  return {
    cont: m('container_steel', S.ccol, 0.5, 0.25), infill: m('infill_panel', S.icol, 0.8), charcoal: m('fibre_cement_charcoal', '#55585b', 0.8),
    frame: m('container_frame', '#9aa3aa', 0.45, 0.35), casting: m('corner_casting', '#8b9399', 0.5, 0.4), roof: m('roof_membrane', '#6c6f72', 0.8),
    store: m('window_frame', '#2b2e31', 0.4, 0.4), glass: m('glazing', '#a8c6d2', 0.05, 0.1, { transparent: true, opacity: 0.3, depthWrite: false }),
    gyp: m('gypsum_white', '#f3f2ef', 0.9), floor: m('floor_concrete_polished', '#9c9892', 0.5), wood: m('wood_floor', '#8a7358', 0.75),
    mesh: m('chain_link_mesh', '#3d4144', 0.5, 0.4, { transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false }),
    bglass: m('balustrade_glass', '#b9d3d8', 0.05, 0.1, { transparent: true, opacity: 0.38, side: THREE.DoubleSide, depthWrite: false }), perf: m('perforated_steel', '#4a4e52', 0.5, 0.3, { transparent: true, opacity: 0.88, side: THREE.DoubleSide }),
    rail: m('steel_white', '#e9eaea', 0.4, 0.3), deck: m('timber_deck', '#9c7d4f', 0.85), concrete: m('concrete', '#c9c6c0', 0.95),
    cab: m('cabinet_white', '#f4f4f1', 0.5), stone: m('worktop', '#d9d8d3', 0.4), ceramic: m('ceramic', '#fafaf8', 0.2), fabric: m('fabric', '#6f7277', 0.95),
    sheet: m('bed_linen', '#e9e8e4', 0.95), black: m('matte_black', '#1b1c1d', 0.6), steel: m('steel_grey', '#8f9396', 0.45, 0.5),
  };
}
function box(p, name, w, h, d, x, y, z, mat) { const me = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.001), Math.max(h, 0.001), Math.max(d, 0.001)), mat); me.name = name; me.position.set(x, y, z); p.add(me); return me; }
function cyl(p, name, r, h, x, y, z, mat) { const me = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 12), mat); me.name = name; me.position.set(x, y, z); p.add(me); return me; }
function grp(p, name, lvl) { const g = new THREE.Group(); g.name = name; if (lvl != null) g.userData.lvl = lvl; p.add(g); return g; }
const sub = (base, cuts) => { let r = base; for (const [k0, k1] of cuts) r = r.flatMap(([a, b]) => b <= k0 || a >= k1 ? [[a, b]] : [[a, Math.min(b, k0)], [Math.max(a, k1), b]]); return r.filter(([a, b]) => b - a > 0.02); };

// face: axis 'z' → plane z, u along x ; axis 'x' → plane x, u along z
function wall(p, M, axis, plane, s, a0, a1, y0, h, ops, mat, o = {}) {
  const corr = o.corr !== false, lining = o.lining !== false;
  for (const [b0, b1] of sub([[a0, a1]], o.gaps || [])) {
    const inside = ops.filter(q => q.u0 >= b0 - 0.01 && q.u1 <= b1 + 0.01).sort((a, b) => a.u0 - b.u0), rects = [];
    let cur = b0;
    for (const q of inside) { rects.push([cur, q.u0, 0, h], [q.u0, q.u1, 0, q.v0], [q.u0, q.u1, q.v1, h]); cur = q.u1; }
    rects.push([cur, b1, 0, h]);
    const put = (name, u0, u1, v0, v1, off, t, m) => { const cu = (u0 + u1) / 2, cv = y0 + (v0 + v1) / 2; return axis === 'z' ? box(p, name, u1 - u0, v1 - v0, t, cu, cv, plane + s * off, m) : box(p, name, t, v1 - v0, u1 - u0, plane + s * off, cv, cu, m); };
    for (const [u0, u1, v0, v1] of rects) {
      if (u1 - u0 < 0.01 || v1 - v0 < 0.01) continue;
      put(corr ? 'corrugated_panel' : 'infill_panel', u0, u1, v0, v1, corr ? -0.01 : 0, corr ? 0.02 : 0.08, mat);
      if (corr) for (let u = Math.ceil((u0 + 0.07) / 0.28) * 0.28; u + 0.06 < u1; u += 0.28) put('corrugation', u - 0.06, u + 0.06, v0, v1, 0.012, 0.025, mat);

    for (const q of inside) storefront(p, M, axis, plane - s * 0.01, q, y0);
  }
}
function storefront(p, M, axis, plane, o, y0) {
  const g = grp(p, o.kind || 'storefront'); if (o.slot) g.userData.slot = o.slot;
  const w = o.u1 - o.u0, h = o.v1 - o.v0, fw = 0.055, fd = 0.1;
  const put = (name, u0, u1, v0, v1, d, m) => { const cu = (u0 + u1) / 2, cv = y0 + (v0 + v1) / 2; return axis === 'z' ? box(g, name, u1 - u0, v1 - v0, d, cu, cv, plane, m) : box(g, name, d, v1 - v0, u1 - u0, plane, cv, cu, m); };
  put('frame', o.u0, o.u1, o.v1 - fw, o.v1, fd, M.store); put('frame', o.u0, o.u1, o.v0, o.v0 + fw, fd, M.store);
  put('frame', o.u0, o.u0 + fw, o.v0, o.v1, fd, M.store); put('frame', o.u1 - fw, o.u1, o.v0, o.v1, fd, M.store);
  const cols = o.cols || 1, rows = o.rows || 1, cw = w / cols, rh = h / rows;
  for (let c = 1; c < cols; c++) put('mullion', o.u0 + c * cw - fw / 2, o.u0 + c * cw + fw / 2, o.v0, o.v1, fd, M.store);
  for (let r = 1; r < rows; r++) put('transom', o.u0, o.u1, o.v0 + r * rh - fw / 2, o.v0 + r * rh + fw / 2, fd, M.store);
  put('glass', o.u0 + fw, o.u1 - fw, o.v0 + fw, o.v1 - fw, 0.012, M.glass).userData.glass = true;
  const doorCols = o.door === 'both' ? [...Array(cols).keys()] : o.door != null ? [o.door] : [];
  for (const dc of doorCols) { const d0 = o.u0 + dc * cw; put('door_pull', d0 + (dc ? 0.12 : cw - 0.15), d0 + (dc ? 0.15 : cw - 0.12), o.v0 + 0.85, o.v0 + 1.25, fd * 2, M.steel); }
}
function frame(p, M, c, holes = []) {
  const g = grp(p, 'container_frame'), dx = c.x1 - c.x0, dz = c.z1 - c.z0, y0 = c.y0;
  for (const x of [c.x0 + FP / 2, c.x1 - FP / 2]) for (const z of [c.z0 + FP / 2, c.z1 - FP / 2]) {
    box(g, 'corner_post', FP, H, FP, x, y0 + H / 2, z, M.frame);
    for (const y of [y0 + 0.06, y0 + H - 0.06]) box(g, 'corner_casting', 0.18, 0.12, 0.17, x, y, z, M.casting);
  }

function fcPayload() {
