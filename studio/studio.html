<style>
  :root{--bg:#f2f0eb;--panel:#fbfaf7;--ink:#1c1b19;--muted:#6b6862;--line:#dedad2;--accent:oklch(0.62 0.16 45);--warn:oklch(0.66 0.14 75);--err:oklch(0.55 0.18 28);--ok:oklch(0.58 0.12 150)}
  *{box-sizing:border-box}

  a{color:var(--ink)} a:hover{color:var(--accent)}
  button{font:inherit;color:inherit}
  three-d-stage:not(:defined){visibility:hidden}
  .app{display:grid;grid-template-columns:292px minmax(0,1fr) 320px;height:100vh}
  .side{background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .cat{border-right:1px solid var(--line)}
  .props{border-left:1px solid var(--line)}
  .sh{padding:18px 18px 12px;border-bottom:1px solid var(--line)}

  h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .search{margin-top:12px;width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff}
  .search:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
  .scroll{overflow-y:auto;min-height:0;flex:1}
  .grp{border-bottom:1px solid var(--line)}
  .grp>summary{list-style:none;cursor:pointer;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .grp>summary::-webkit-details-marker{display:none}
  .grp>summary::after{content:"+";font-size:14px;color:var(--muted)}
  .grp[open]>summary::after{content:"–"}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 14px 14px}
  .card{border:1px solid var(--line);border-radius:7px;background:#fff;cursor:grab;touch-action:none;user-select:none;display:flex;flex-direction:column;overflow:hidden;transition:border-color .12s}
  .card:hover{border-color:#aaa498}
  .card .th{aspect-ratio:4/3;background:#efece6;display:flex;align-items:center;justify-content:center}
  .card .th img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .card .th span{font:400 10px "IBM Plex Mono",monospace;color:var(--muted)}
  .card b{font-size:12px;font-weight:500;padding:7px 8px 0;line-height:1.25}
  .card i{font-style:normal;font:400 10.5px/1.3 "IBM Plex Mono",monospace;color:var(--muted);padding:2px 8px 8px}
  .viewport{position:relative;min-height:0;min-width:0}
  three-d-stage{display:block;width:100%;height:100%}
  .tb{position:absolute;top:14px;left:14px;right:14px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
  .tb>*{pointer-events:auto}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}

  .seg button.on{background:var(--ink);color:#fff}
  .seg button[disabled]{opacity:.35;pointer-events:none}
  .hintbar{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:rgba(28,27,25,.88);color:#fff;font-size:12.5px;padding:8px 13px;border-radius:6px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s}
  .hintbar.show{opacity:1}
  .hintbar.bad{background:var(--err)}
  .ph{padding:18px;border-bottom:1px solid var(--line)}
  .pc{padding:16px 18px 24px;display:flex;flex-direction:column;gap:20px}

  .swatches{display:flex;gap:7px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;outline-offset:3px}
  .sw.on{outline:2px solid var(--ink)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 12px;height:36px;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--ink)}

  .btn[disabled]{opacity:.35;pointer-events:none}

  .total{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-top:4px}
  .total b{font-size:20px;font-weight:600}
  .note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
  .keys{font:400 11px/1.8 "IBM Plex Mono",monospace;color:var(--muted)}
  .keys kbd{font:inherit;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:#fff;color:var(--ink)}
  .chip{position:fixed;z-index:30;pointer-events:none;width:96px;background:#fff;border:1px solid var(--ink);border-radius:7px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);transform:translate(-50%,-60%);display:none}
  .chip img{width:100%;display:block;background:#efece6}
  .chip b{display:block;font-size:11px;font-weight:500;padding:4px 6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 15px;border-radius:6px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:12px 12px 0}
  .step{appearance:none;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:44px}
  .step:hover{border-color:#aaa498}
  .step i{font:500 9.5px/1 "IBM Plex Mono",monospace;color:var(--muted);font-style:normal}
  .step b{font-size:12px;font-weight:500}
  .step.on{background:var(--ink);color:#fff;border-color:var(--ink)} .step.on i{color:#bdb8ae}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.2);margin-right:6px;vertical-align:-1px}
  .link{appearance:none;border:0;background:none;padding:0;font:400 11px "IBM Plex Mono",monospace;color:var(--muted);text-decoration:underline;cursor:pointer}
  .bom{width:100%;border-collapse:collapse;font-size:12px}
  .bom td{padding:5px 0;border-bottom:1px solid #ece9e2;vertical-align:top}
  .bom td.n{text-align:right;white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
  .bom .auto{font:500 9px/1 "IBM Plex Mono",monospace;color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:2px 3px;margin-left:5px;vertical-align:1px}
  #print{display:none}
  @media print{html,body{overflow:visible!important;height:auto!important}.app,.toast,.chip{display:none!important}#print{display:block;font:10.5pt "IBM Plex Sans",sans-serif;color:#1c1b19}#print table{width:100%;border-collapse:collapse;margin-top:8px}#print td,#print th{padding:4px 0;border-bottom:1px solid #ddd;text-align:left}#print .n{text-align:right}#print img{width:100%;max-height:320px;object-fit:contain;background:#e9e6df}#print tr{break-inside:avoid}}
  @media (max-width:1100px){.app{grid-template-columns:250px minmax(0,1fr) 280px}}
  @media (max-width:800px){html,body{overflow:auto}.app{grid-template-columns:1fr;grid-template-rows:55vh auto auto;height:auto}.viewport{order:-1}.cat,.props{border:0;border-top:1px solid var(--line)}.scroll{max-height:none}}
</style>

<script type="module">
const stage = document.querySelector('three-d-stage');

const CATALOG = [

function cyl(g, name, rt, rb, h, x, y, z, mat) { const me = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 24), mat); me.name = name; me.position.set(x, y, z); g.add(me); return me; }

function bed(g, M, it, w, d) {

  box(g, 'duvet', w - 0.02, 0.06, d * 0.62, 0, 0.5, d / 2 - d * 0.31, M.fab(it.color || '#c9bfae'));
  const n = w > 1.2 ? 2 : 1; for (let k = 0; k < n; k++) box(g, 'pillow', w / n - 0.14, 0.12, 0.4, -w / 2 + (k + 0.5) * w / n, 0.54, -d / 2 + 0.33, M.sheet);

  const mod = (len) => ({ id: 't', len, x: 0, z: 0, rot: 0, lvl: 0, finish: 'painted', color: '#d9d5cc' });
  for (const sku of Object.keys(CATX)) {
    const d = CATX[sku];
    if (d.kind === 'room') continue;
    if (d.kind === 'furn') {
      const fg = new THREE.Group(); d.build(fg, mats(base), {}); ts.add(fg);
      const sp = new THREE.Box3().setFromObject(fg).getBoundingSphere(new THREE.Sphere()), dd = sp.radius / Math.sin((tc.fov * Math.PI) / 360) * 1.05;
      tc.position.copy(sp.center).add(new THREE.Vector3(0.9, 0.85, 1.3).normalize().multiplyScalar(dd)); tc.lookAt(sp.center);
      tr.render(ts, tc); THUMBS[sku] = tr.domElement.toDataURL('image/png');
      ts.remove(fg); disposeTree(fg); continue;
    }
    let p, focus = null, dir = new THREE.Vector3(1, 0.55, 1.3);
    if (d.kind === 'design') { p = { ...base, rooms: [], ...clone(designData(sku)) }; dir = new THREE.Vector3(1, 0.85, 1.3); }
    else if (d.kind === 'module') p = { ...base, mods: [mod(d.len)], items: [] };
    else if (d.kind === 'opening') { p = { ...base, mods: [mod(20)], items: [{ id: 'x', sku, mod: 't', side: '+z', u: 0 }] }; focus = 'x'; dir = new THREE.Vector3(0.3, 0.12, 1); }
    else if (d.kind === 'wall') { p = { ...base, mods: [mod(20)], items: [{ id: 'x', sku, mod: 't', side: '+z', u: 0 }] }; dir = new THREE.Vector3(0.9, 0.5, 1.2); }
    else if (d.kind === 'roof') { p = { ...base, mods: [mod(20)], items: [{ id: 'x', sku, mod: 't' }] }; dir = new THREE.Vector3(0.8, 1.1, 1.2); }
    else if (d.kind === 'part') { p = { ...base, mods: [mod(20)], items: [{ id: 'x', sku, mod: 't', lx: 0 }] }; dir = new THREE.Vector3(1.1, 1.6, 0.9); }
    else { p = { ...base, mods: [], items: [{ id: 'x', sku, x: 0, z: 0, rot: 0 }] }; dir = new THREE.Vector3(1.2, 0.5, 0.8); }
    const savedP = P; P = p;
    const r = buildProject(p);
    P = savedP;
    if (d.kind === 'part') r.root.traverse(n => { if (n.userData.roofPart) n.visible = false; });
    ts.add(r.root);
    const b = new THREE.Box3().setFromObject(focus ? r.OBJ[focus] : r.root);
    if (focus) b.expandByVector(new THREE.Vector3(0.5, 0.25, 0.2));
    const sph = b.getBoundingSphere(new THREE.Sphere());
    const dist = sph.radius / Math.sin((tc.fov * Math.PI) / 360) * 1.02;
    tc.position.copy(sph.center).add(dir.normalize().multiplyScalar(dist)); tc.lookAt(sph.center);
    tr.render(ts, tc);
    THUMBS[sku] = tr.domElement.toDataURL('image/png');
    ts.remove(r.root); disposeTree(r.root);
  }
  tr.dispose(); tr.forceContextLoss();
}

      ${it.sku === 'S-ATRIUM' ? `<section><h2>Glass wall</h2><div class="grid">${[['full', 'Full height'], ['lower', 'Ground only'], ['solid', 'Solid + slider']].map(([v, l]) => opt((it.glass || 'full') === v, `data-atr="glass" data-av="${v}"`, l)).join('')}</div></section><section><h2>Mezzanine</h2><div class="grid">${[['part', '2.8 m deep'], ['full', 'Full depth'], ['none', 'None']].map(([v, l]) => opt((it.mezz || 'part') === v, `data-atr="mezz" data-av="${v}"`, l)).join('')}</div></section><section><h2>Clerestory &amp; sliding wall</h2><div class="grid">${opt(it.clere !== false, `data-atr="clere" data-av="${it.clere === false}"`, it.clere === false ? 'Add clerestory' : 'Clerestory on')}${[[0, 'Wall open'], [0.5, 'Half'], [1, 'Closed']].map(([v, l]) => opt((it.slide ?? 0.4) === v, `data-atr="slide" data-av="${v}"`, l)).join('')}</div></section>` : ''}
      ${swaps ? `<section><h2>Swap type</h2><div class="grid">${swaps}</div></section>` : ''}
      <section class="btns">${d.kind === 'floor' ? '<button class="btn" data-act="rot-sel">Rotate 90°</button>' : ''}<button class="btn danger" data-act="del-sel">Delete</button></section>
      <p class="note">Drag to move${d.kind === 'opening' ? ' along the wall or onto another wall' : d.kind === 'roof' ? ' to another roof' : ''}. <b>Delete</b> key removes it.</p>
    </div>`;
  } else {
    const E = EVAL;
    html = `<div class="ph"><div class="eyebrow">Project</div><div class="title">Container House Studio</div><div class="sub">${P.mods.length} modules · ${E.levels} storey${E.levels === 1 ? '' : 's'} · ${E.area.toFixed(1)} m² / ${Math.round(E.area * FT_PER_M * FT_PER_M)} ft²</div></div>
    <div class="pc">
      <section><h2>Checks <span>UK Building Regs</span></h2>${checksHtml(E.issues)}</section>
      <section><h2>Module height</h2><div class="grid">${opt(P.h === 'std', 'data-ph="std"', 'Standard', '2.59 m · 8′ 6″')}${opt(P.h === 'hc', 'data-ph="hc"', 'High cube', '2.90 m · 9′ 6″')}</div></section>
      <section><h2>Frame &amp; trim <span>${(TRIMS.find(t => t[0] === P.trim) || [0, ''])[1]}</span></h2><div class="swatches">${TRIMS.map(([c, n]) => `<button class="sw${P.trim === c ? ' on' : ''}" style="background:${c}" data-ptrim="${c}" aria-label="${n}"></button>`).join('')}</div></section>
      <section><h2>Shell estimate <span>${window.FirmcopBridge.currency().code}</span></h2><div class="lines">${E.lines.map(l => `<div><span>${l.name}${l.auto ? '<span class="auto">AUTO</span>' : ''} <span style="color:var(--muted)">× ${l.qty} ${l.unit}</span></span><span>${$(l.total)}</span></div>`).join('')}</div>
        <div class="total"><span>Structure &amp; openings</span><b>${$(E.total)}</b></div>
        <p class="note" style="margin-top:6px">Sample prices. Full BOM and export in step 6.</p></section>
      <section class="btns"><button class="btn" data-act="example">Load example</button><button class="btn danger" data-act="clear">Clear site</button></section>
      <section class="keys">Drag from catalog to place · click to select<br><kbd>R</kbd> rotate · <kbd>Del</kbd> delete · <kbd>Esc</kbd> cancel<br><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> redo</section>
    </div>`;
  }
  el.innerHTML = html;
}
let toastT;
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 2600); }

function modChange(fn) {
  const s = findSel(); if (!s) return;
  const test = clone(P), tm = test.mods.find(m => m.id === s.id); fn(tm, test);
  const saved = P; P = test; const a = analyze(test.mods); P = saved;
  const before = analyze(P.mods).issues.filter(i => i.level === 'error').map(i => i.text);
  const bad = a.issues.find(i => i.level === 'error' && !before.includes(i.text));
  if (bad) return toast(bad.text + ' — change blocked');
  const floorClash = tm.lvl === 0 && test.items.some(it => CATX[it.sku].kind === 'floor' && interArea(floorRect(it), rectOf(tm)) > 0.01);
  if (floorClash) return toast('Clashes with a column or stair — change blocked');
  let removed = 0;
  commit(p => {
    const m = p.mods.find(x => x.id === s.id); fn(m, p);
    p.items = p.items.filter(it => { if (it.mod === m.id && it.lx != null) { const L = LEN[m.len], ok = CATX[it.sku].kind === 'part' ? Math.abs(it.lx) <= L / 2 - 0.9 : (() => { const r = fp(it.sku, it.lx, it.lz, it.rot); return r.x0 >= -L / 2 + IN - 1e-3 && r.x1 <= L / 2 - IN + 1e-3; })(); if (!ok) removed++; return ok; } if (it.mod !== m.id || !it.side) return true; const d = CATX[it.sku], len = sideLen(m, it.side), w = d.kind === 'opening' ? d.w : 0.5; const ok = Math.abs(it.u) + w / 2 <= len / 2 - F - 0.05 + 1e-6; if (!ok) removed++; return ok; });
  }, true);
  if (removed) toast(`${removed} item${removed > 1 ? 's' : ''} no longer fit and were removed`);
}
function rotateSel() {
  const s = findSel(); if (!s || SEL.type === 'room') return;
  if (SEL.type === 'item' && CATX[s.sku].kind === 'furn') {
    const m = modById(s.mod), nr = ((s.rot || 0) + Math.PI / 2) % (2 * Math.PI), z = CUR.info.zones.find(z => z.mod === s.mod && s.lx >= z.x0 && s.lx <= z.x1), r = fp(s.sku, s.lx, s.lz, nr), zi = W / 2 - IN;
    if (!z || r.x0 < z.bx0 - 1e-3 || r.x1 > z.bx1 + 1e-3 || r.z0 < -zi - 1e-3 || r.z1 > zi + 1e-3) return toast('No room to rotate here');
    const c = checkFurn(m, P, s.sku, s.lx, s.lz, nr, s.id); if (!c.valid) return toast(c.reason);
    return commit(p => { p.items.find(i => i.id === s.id).rot = nr; });
  }
  if (SEL.type === 'mod') return modChange(m => { m.rot = (m.rot || 0) ? 0 : Math.PI / 2; });
  if (CATX[s.sku].kind !== 'floor') return;
  const test = { ...s, rot: ((s.rot || 0) + Math.PI / 2) % (2 * Math.PI) };
  if (P.mods.some(m => m.lvl === 0 && interArea(rectOf(m), floorRect(test)) > 0.005)) return toast('No room to rotate here');
  commit(p => { p.items.find(i => i.id === s.id).rot = test.rot; });
}
function deleteSel() {
  const s = findSel(); if (!s || SEL.type === 'room') return;
  if (SEL.type === 'mod') {
    if (P.mods.some(o => o.lvl === s.lvl + 1 && interArea(rectOf(o), rectOf(s)) > 0.1)) return toast('Remove the module above first');
    commit(p => { p.mods = p.mods.filter(m => m.id !== s.id); p.items = p.items.filter(it => it.mod !== s.id); p.rooms = p.rooms.filter(r => r.mod !== s.id); });
  } else commit(p => { p.items = p.items.filter(i => i.id !== s.id); });
  SEL = null; rebuild();
}
function setView(mode) {
  if (mode === V.mode) return;
  V.mode = mode;
  const t = controls.target, dist = camera.position.distanceTo(t);
  if (mode === 'plan') {
    V.saved = camera.position.clone();
    controls.minPolarAngle = 0; controls.maxPolarAngle = 0.0001; controls.enableRotate = false;
    camera.position.set(t.x, t.y + dist, t.z + 0.001);
  } else {
    controls.minPolarAngle = 0; controls.maxPolarAngle = Math.PI / 2 - 0.04; controls.enableRotate = true;
    if (V.saved) camera.position.copy(V.saved);
  }
  controls.update(); rebuild();
}

document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.card');
  if (!card || e.button !== 0) return;
  e.preventDefault();
  const sku = card.dataset.sku;
  DRAG = { src: 'catalog', sku, rot: 0 };
  chip.querySelector('img').src = THUMBS[sku] || ''; chip.querySelector('b').textContent = CATX[sku].name;
  chip.style.left = e.clientX + 'px'; chip.style.top = e.clientY + 'px'; chip.style.display = 'block';
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const ds = t.dataset;
  if (ds.step) return setStep(ds.step);
  if (ds.keep) return commit(p => { const m = p.mods.find(x => x.id === SEL.id), k = m.keep || []; m.keep = k.includes(ds.keep) ? k.filter(s => s !== ds.keep) : [...k, ds.keep]; });
  if (ds.cut != null) { V.cut = +ds.cut; return rebuild(); }
  if (ds.selroom) { SEL = { type: 'room', id: ds.selroom }; updateSel(); return renderProps(); }
  if (ds.selitem) { SEL = { type: 'item', id: ds.selitem }; updateSel(); return renderProps(); }
  if (ds.rtype) { const z = findSel(); return setRoom(z.mod, z.zi, { type: ds.rtype }); }
  if (ds.rfloor) { const z = findSel(); return setRoom(z.mod, z.zi, { floor: ds.rfloor }); }
  if (ds.mlining) { const id = SEL.type === 'room' ? findSel().mod : SEL.id; return commit(p => { p.mods.find(m => m.id === id).lining = ds.mlining; }); }
  if (ds.atr) return commit(p => { const it = p.items.find(i => i.id === SEL.id); const v = ds.av; it[ds.atr] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; });
  if (ds.fcol) return commit(p => { p.items.find(i => i.id === SEL.id).color = ds.fcol; });
  if (ds.view) return setView(ds.view);
  if (ds.level) { V.level = ds.level === 'all' ? 'all' : +ds.level; return rebuild(); }
  if (ds.mlen) return modChange(m => { m.len = +ds.mlen; });
  if (ds.mfin) return commit(p => { p.mods.find(m => m.id === SEL.id).finish = ds.mfin; });
  if (ds.mcol) return commit(p => { const m = p.mods.find(m => m.id === SEL.id); m.color = ds.mcol; m.finish = 'painted'; });
  if (ds.swap) return commit(p => { p.items.find(i => i.id === SEL.id).sku = ds.swap; });
  if (ds.ph) return commit(p => { p.h = ds.ph; });
  if (ds.ptrim) return commit(p => { p.trim = ds.ptrim; });
  const a = ds.act;
  if (a === 'roof') { V.roof = !V.roof; return rebuild(); }
  if (a === 'undo') return undo();
  if (a === 'redo') return redo();
  if (a === 'rot-sel') return rotateSel();
  if (a === 'del-sel') return deleteSel();
  if (a === 'flip') return commit(p => { const it = p.items.find(i => i.id === SEL.id); it.flip = !it.flip; });
  if (a === 'dup') return dupSel();
  if (a === 'clear-room') { const z = findSel(); return commit(p => { p.items = p.items.filter(i => !z.furn.some(f => f.id === i.id)); }); }
  if (a === 'csv') return exportCsv();
  if (a === 'print') return printBom();
  if (a === 'example') { SEL = null; return commit(p => { Object.assign(p, example()); }, true); }
  if (a === 'clear') { SEL = null; return commit(p => { p.mods = []; p.items = []; p.rooms = []; }); }
});
document.getElementById('search').addEventListener('input', renderCatalog);
window.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); return redo(); }
  if (k === 'r') {
    if (DRAG && ['module', 'floor', 'furn'].includes(CATX[DRAG.sku].kind)) { DRAG.manual = true; DRAG.rot = CATX[DRAG.sku].kind === 'module' ? (DRAG.rot ? 0 : Math.PI / 2) : (DRAG.rot + Math.PI / 2) % (2 * Math.PI); if (DRAG.last) dragMove(DRAG.last); }
    else if (!DRAG) rotateSel();
  }
  if ((k === 'delete' || k === 'backspace') && !DRAG) { e.preventDefault(); deleteSel(); }
  if (k === 'escape') {
    if (DRAG) { if (DRAG.target) DRAG.target.visible = true; DRAG = null; ghost.visible = false; chip.style.display = 'none'; showHint(''); controls.enabled = true; }
    else if (SEL) { SEL = null; updateSel(); renderProps(); }
  }
});

renderCatalog();
rebuild(true);
window.PlatformRules.onChange(() => { rebuild(); renderProps(); });
setTimeout(() => { makeThumbs(); renderCatalog(); }, 30);
</script>
