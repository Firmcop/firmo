<style>
/* Layout: sales-desk workstation — stage bar on top, catalogue left, viewport centre (2D plan on paper / 3D), inspector right, live quote bar along the bottom. One deliberate dark look. */
:root{
  --ink:#0D0C0A; --panel:#141210; --panel2:#1b1815; --raise:#221f1b; --line:rgba(242,235,223,.11); --line2:rgba(242,235,223,.2);
  --ivory:#F2EBDF; --muted:rgba(242,235,223,.6); --faint:rgba(242,235,223,.38); --brass:#C9A46A; --brass-hi:#E3C48F; --brass-lo:#8A6A33;
  --ok:#7fb48a; --warn:#e2b25c; --err:#e07a6a; --eng:#8fb3d9; --paper:#F4EFE6;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ivory);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr) 348px;grid-template-rows:56px minmax(0,1fr) 62px;height:100vh;height:100dvh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.mark{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--ivory)}
.mark b{font:500 19px/1 var(--serif);letter-spacing:.3em}
.mark small{font:400 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-top:5px}
.stages{display:flex;gap:2px;flex:1;justify-content:center;min-width:0;overflow-x:auto}
.stages button{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.04em;border-bottom:2px solid transparent;white-space:nowrap}
.stages button i{font:500 10px/1 var(--mono);font-style:normal;color:var(--faint)}
.stages button.on{color:var(--ivory);border-bottom-color:var(--brass)}
.stages button.on i{color:var(--brass)}
.tright{display:flex;gap:6px;align-items:center}
.tb{height:34px;padding:0 12px;border:1px solid var(--line2);background:transparent;color:var(--ivory);font-size:12px;border-radius:2px;white-space:nowrap}
.tb:hover{border-color:var(--brass)}
.tb[disabled]{opacity:.35;pointer-events:none}
.tb.on{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600}
aside{background:var(--panel);overflow-y:auto;min-height:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.sec{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.eb{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.h{font:500 22px/1.15 var(--serif);margin:0}
.sub{color:var(--muted);font-size:12px}
.lnk{background:none;border:0;padding:0;color:var(--brass-hi);text-decoration:underline;font:inherit;cursor:pointer}
.note{color:var(--muted);font-size:11.5px;line-height:1.5;margin:0}
.seg{display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
.seg button{flex:1;height:32px;border:0;background:transparent;color:var(--muted);font-size:12px;padding:0 6px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--raise);color:var(--ivory);box-shadow:inset 0 -2px 0 var(--brass)}
.cards{display:grid;grid-template-columns:1fr;gap:6px}
.cards.two{grid-template-columns:1fr 1fr}
.card{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;touch-action:none;user-select:none}
.card:hover{border-color:var(--line2)}
.card.on{border-color:var(--brass);background:var(--raise)}
.card b{font-weight:600;font-size:12.5px}
.card small{color:var(--muted);font:400 10.5px/1.35 var(--mono)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(127,180,138,.4)} .chip.warn{color:var(--warn);border-color:rgba(226,178,92,.4)} .chip.err{color:var(--err);border-color:rgba(224,122,106,.45)} .chip.eng{color:var(--eng);border-color:rgba(143,179,217,.45)} .chip.br{color:var(--brass);border-color:rgba(201,164,106,.5)}
.sw{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.18);padding:0}
.sw.on{outline:2px solid var(--brass);outline-offset:2px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.fsw{width:100%;height:30px;border-radius:2px;border:1px solid rgba(255,255,255,.1)}
.list{display:flex;flex-direction:column}
.list>div,.list>button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:12.5px;color:var(--ivory)}
.list>button:hover{color:var(--brass-hi)}
.list span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.list .sel{color:var(--brass-hi)}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted)}
.lbl>span{display:flex;justify-content:space-between}
.lbl b{color:var(--ivory);font-weight:500}
input[type=range]{width:100%;accent-color:var(--brass)}
select,input[type=text],input[type=tel]{height:34px;border:1px solid var(--line2);border-radius:2px;background:var(--panel2);padding:0 8px;font-size:12.5px;width:100%;min-width:0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border:1px solid var(--line2);background:transparent;border-radius:2px;font-size:12px;font-weight:600;letter-spacing:.03em}
.btn:hover{border-color:var(--brass);color:var(--brass-hi)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.gold:hover{background:var(--brass-hi);color:var(--ink)}
.btn.del{color:var(--err);border-color:rgba(224,122,106,.4)}
.btn.wide{width:100%}
.insp{background:var(--raise)}
.units{display:flex;flex-direction:column;gap:4px}
.unit{display:grid;grid-template-columns:18px minmax(0,1fr) 46px auto;gap:6px;align-items:center;font-size:12px}
.unit i{font:400 10px var(--mono);color:var(--faint);font-style:normal}
.unit select{height:30px;font-size:12px}
.unit small{font:400 10.5px var(--mono);color:var(--muted);text-align:right}
.unit .ib{width:26px;height:28px;border:1px solid var(--line);background:none;border-radius:2px;color:var(--muted);padding:0}
.unit .ib:hover{color:var(--ivory);border-color:var(--line2)}
main#vp{position:relative;min-width:0;min-height:0;background:#11100e;overflow:hidden}
#three{position:absolute;inset:0}
#three canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
#plan{position:absolute;inset:0;width:100%;height:100%;background:var(--paper);touch-action:none;user-select:none}
.vtog{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:3}
.vtog .seg{background:rgba(20,18,16,.88);width:120px}
.vhint{position:absolute;left:14px;bottom:14px;max-width:min(460px,70%);font-size:11.5px;color:var(--muted);background:rgba(20,18,16,.86);border:1px solid var(--line);padding:7px 10px;border-radius:2px;z-index:3}
.vhint.paper{background:rgba(244,239,230,.94);color:#4b463f;border-color:#d8d0c2}
.walkpad{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,40px);gap:4px;z-index:3}
.walkpad button{height:40px;border:1px solid var(--line2);background:rgba(20,18,16,.88);border-radius:2px;font-size:15px}
.walkpad[hidden]{display:none}
.walkpad .x{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.06em}
footer.qbar{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 16px;border-top:1px solid var(--line);background:var(--panel);overflow-x:auto}
.qbar .nm{font:500 18px/1 var(--serif);white-space:nowrap}
.qbar .kv{display:flex;flex-direction:column;gap:3px;white-space:nowrap}
.qbar .kv small{font:400 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.qbar .kv b{font-size:14px;font-variant-numeric:tabular-nums;font-weight:600}
.qbar .kv b.big{font:500 22px/1 var(--serif);color:var(--brass-hi)}
.qbar .sp{flex:1}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);background:var(--ivory);color:var(--ink);padding:9px 14px;border-radius:2px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#chip{position:fixed;pointer-events:none;z-index:70;display:none;padding:6px 10px;background:var(--brass);color:var(--ink);font-weight:700;font-size:12px;border-radius:2px;transform:translate(10px,10px)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gal button{padding:0;border:1px solid var(--line);background:#000;aspect-ratio:4/3;border-radius:2px;overflow:hidden;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal span{position:absolute;left:3px;bottom:3px;font:500 8.5px/1 var(--mono);background:rgba(13,12,10,.8);padding:3px 4px;color:var(--ivory);letter-spacing:.06em}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.job .bar{grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.job .bar i{display:block;height:100%;background:var(--brass);transition:width .4s}
.pipe{display:flex;flex-direction:column;gap:0}
.pipe div{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;font-size:12.5px;color:var(--faint)}
.pipe div i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line2);margin-top:4px}
.pipe div.done{color:var(--ivory)} .pipe div.done i{background:var(--brass);border-color:var(--brass)}
.pipe div.cur{color:var(--brass-hi)} .pipe div.cur i{border-color:var(--brass);box-shadow:0 0 0 3px rgba(201,164,106,.2)}
details.how summary{cursor:pointer;font-size:12px;color:var(--brass-hi)}
details.how ol{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;gap:5px}
#modal{position:fixed;inset:0;background:rgba(5,5,4,.78);z-index:50;display:none;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
#modal.show{display:block}
.mbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:960px;margin:0 auto 14px;z-index:2}
.doc{max-width:960px;margin:0 auto;background:#FBF8F2;color:#1c1a17;padding:44px 52px;font:13px/1.55 var(--sans)}
.doc h1{font:400 40px/1.05 var(--serif);margin:6px 0 4px}
.doc h2{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#7A5C2A;margin:30px 0 10px;padding-top:14px;border-top:1px solid #e3dccf}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc td,.doc th{padding:6px 6px;border-bottom:1px solid #ebe5da;text-align:left;vertical-align:top}
.doc th{font-weight:600;color:#6b6457}
.doc td.n,.doc th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .meta{font:400 11px/1.5 var(--mono);color:#6b6457}
.doc .cover{width:100%;aspect-ratio:16/8;object-fit:cover;background:#ddd;display:block;margin-top:18px}
.doc .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.doc .tot{display:flex;justify-content:space-between;font-size:15px;padding:8px 6px;border-bottom:1px solid #d9d1c2}
.doc .tot b{font:500 24px/1 var(--serif)}
.doc .mil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.doc .mil div{border:1px solid #e3dccf;padding:10px}
.doc .mil b{display:block;font:500 20px/1.1 var(--serif)}
.doc svg{width:100%;height:auto;display:block;border:1px solid #e3dccf}
.pano{max-width:1200px;margin:0 auto;aspect-ratio:16/9;max-height:78vh;background:#000;position:relative}
.pano canvas{width:100%!important;height:100%!important;display:block}
.pano p{position:absolute;left:12px;bottom:10px;margin:0;font-size:11.5px;color:#ddd;background:rgba(0,0,0,.5);padding:4px 8px}
.still{max-width:1200px;margin:0 auto;display:block;width:100%;height:auto}
.empty{color:var(--faint);font-size:12px;padding:6px 0}
@media (max-width:1000px){html,body{overflow:auto;height:auto}.app{grid-template-columns:1fr;grid-template-rows:auto 62vh auto auto auto;height:auto}main#vp{grid-row:2}#left{grid-row:3;border-right:0;border-top:1px solid var(--line)}#right{grid-row:4;border-left:0}footer.qbar{grid-row:5;flex-wrap:wrap;padding-block:10px}header.top{flex-wrap:wrap;padding-block:6px}.stages{order:3;width:100%;justify-content:flex-start}.stages button{height:42px}.doc{padding:28px 20px}.doc .grid2,.doc .mil{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <header class="top">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DS = window.DS, { PRESETS, SYS, OPEN, FIN, KU, WU, FRONTS, TOPS, ITEMS, C, CLAD, LIGHT, PORCH, SHADE, EXT } = DS;
const $ = s => document.querySelector(s);
const KSh = v => 'KSh ' + Math.round(v).toLocaleString('en-US');
const m2 = v => (Math.round(v * 10) / 10).toFixed(1) + ' m²';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const snap = (v, s) => Math.round(v / s) * s;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------------- state ----------------
const KEY = 'fc-design-studio-v1';
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && PRESETS[s.preset] && Array.isArray(s.parts)) return s; } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
let P = load() || DS.starter('tw40', 'Twin 40 family home');
let HIST = [], FUT = [], PENDING = false;
let STAGE = 'shell', VIEW = '3d', SEL = null, TOOL = 'select', CLIENT = false, SHOWCHECKS = false;
let SHELLSYS = PRESETS[P.preset].sys, ADDSIDE = 'S', FTAB = 'kitchen', NTAB = 'floor', WSIDE = 'S', DSIDE = 'E', LIGHTK = Object.keys(LIGHT)[0];
let G, R, L, Q, A, DIRTY3D = true;
const RENDERS = [], JOBS = [];
let AUTHOR = false, SESSION = null, AF = null;
try { SESSION = JSON.parse(localStorage.getItem('fc-ds-session') || 'null'); } catch (e) {}
let SCENE = 'day', CUT = false, WALK = null, STATUS = 0, LINK = null;
const CLIENTINFO = { name: 'Achieng Otieno', phone: '+254 7XX XXX XXX', site: 'Naivasha, plot 14' };
const STAGES = [['shell', 'Size', '3d'], ['open', 'Openings', '3d'], ['ext', 'Exterior', '3d'], ['plan', 'Interior', '2d'], ['furnish', 'Furnish', '2d'], ['finish', 'Finishes', '3d'], ['render', 'Render', '3d'], ['share', 'Share', '3d']];
const PIPE = ['Design in progress', 'Engineering review', 'Proposal sent to client', 'Deposit requested (M-Pesa)', 'Order placed'];

function recompute() {
  DS.normExt(P); G = DS.grid(P); R = DS.roomInfo(P, G); L = DS.lining(P, G); Q = DS.quote(P, G, R, L); A = DS.analyze(P, G, R);
  if (SEL && !findSel()) SEL = null;
}
function snapshot() { HIST.push(JSON.stringify(P)); if (HIST.length > 80) HIST.shift(); FUT = []; }
function commit(fn) { snapshot(); fn(P); after(); }
function after() { recompute(); DIRTY3D = true; save(); renderUI(); refreshView(); }
function undo() { if (!HIST.length) return; FUT.push(JSON.stringify(P)); P = JSON.parse(HIST.pop()); SEL = null; after(); toast('Undone'); }
function redo() { if (!FUT.length) return; HIST.push(JSON.stringify(P)); P = JSON.parse(FUT.pop()); SEL = null; after(); }
function findSel() {
  if (!SEL) return null;
  if (SEL.kind === 'item') return P.items.find(x => x.id === SEL.id);
  if (SEL.kind === 'run') return P.runs.find(x => x.id === SEL.id);
  if (SEL.kind === 'open') return P.opens.find(x => x.id === SEL.id);
  if (SEL.kind === 'part') return P.parts.find(x => x.id === SEL.id);
  if (SEL.kind === 'room') return R && R.find(x => x.id === SEL.id);
  return null;
}
const LOCKKEY = { item: 'items', run: 'runs', open: 'opens', part: 'parts' };
function locked(kind) { const l = P.design && P.design.rules && P.design.rules.lock; return !AUTHOR && !!l && l.includes(LOCKKEY[kind] || kind); }
function lockToast(kind) { toast(`${{ items: 'Furniture', runs: 'Joinery', opens: 'Doors and windows', parts: 'Partitions' }[LOCKKEY[kind] || kind]} are fixed in this design. Switch on Author to change them`); }
function finAllowed(g, k) { const f = P.design && P.design.rules && P.design.rules.finishes; if (AUTHOR || !f || !f[g] || f[g] === 'all') return true; return f[g].includes(k); }
let toastT; function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 2600); }
const PRE = () => PRESETS[P.preset];
const SYSD = () => SYS[PRE().sys];

// ---------------- placement helpers ----------------
function rectFree(r, ignore) {
