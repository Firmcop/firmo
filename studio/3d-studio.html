<style>
/* Site shell around the Design Studio: the website header stays, the Studio fills the rest of the window. */
html,body{margin:0;height:100%;background:#0D0C0A;color:#F2EBDF;font-family:'Manrope',system-ui,sans-serif}

header{border-bottom:1px solid #1E1B17;flex:0 0 auto}
.bar{max-width:1360px;margin:0 auto;padding:10px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 40px}

.nav a{color:#E8DFD0;text-decoration:none;font-size:12px;letter-spacing:.22em;text-transform:uppercase;padding:12px 0;display:inline-block}
.nav a:hover{color:#C9A46A}
.nav a[aria-current=page]{color:#C9A46A;box-shadow:inset 0 -1px 0 #C9A46A}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;border:1px solid rgba(232,223,208,.5);color:#F2EBDF;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.ghost:hover{border-color:#C9A46A;color:#C9A46A}
:focus-visible{outline:2px solid #C9A46A;outline-offset:2px}
main{flex:1 1 auto;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0D0C0A}
@media (max-width:900px){.page{height:auto}.bar{padding:10px 16px}.nav{gap:0 18px;justify-content:flex-start}main{height:88vh}.ghost{display:none}}
